<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Adarsh Kumar — freelance web developer & AI builder from Delhi. Websites, video edits and 15+ live AI tools shipped in the open."
    />
    <title>Adarsh Kumar — Product Designer & Developer</title>

    <meta property="og:site_name" content="Adarsh Kumar" />
    <meta property="og:title" content="Adarsh Kumar — Product Designer & Developer" />
    <meta
      property="og:description"
      content="Freelance web developer & AI builder — websites, video edits, and AI tools shipped in the open."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adarshu.vercel.app/" />
    <meta property="og:image" content="https://adarshu.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adarsh Kumar — product designer and developer, Delhi" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adarsh Kumar — Product Designer & Developer" />
    <meta
      name="twitter:description"
      content="Freelance web developer & AI builder — websites, video edits, and AI tools shipped in the open."
    />
    <meta name="twitter:image" content="https://adarshu.vercel.app/og.jpg" />
    <link rel="canonical" href="https://adarshu.vercel.app/" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('adarsh-theme');
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
